name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Healthy fixture smoke test
        run: python -m composemedic -f examples/healthy/compose.yaml --format json
      - name: Canonical Compose smoke test
        if: runner.os == 'Linux'
        run: python -m composemedic -f examples/healthy/compose.yaml --resolve --format json
