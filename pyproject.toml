[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "composemedic"
version = "0.1.0"
description = "Read-only diagnostics for Docker Compose: find the problem before changing the stack."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "MysterGuy"}]
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Topic :: System :: Systems Administration"]

[project.urls]
Homepage = "https://github.com/MysterGuy/ComposeMedic"
Issues = "https://github.com/MysterGuy/ComposeMedic/issues"

[project.scripts]
composemedic = "composemedic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
